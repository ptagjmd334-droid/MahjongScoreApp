name: Mahjong app stability, scoring and camera checks
on:
  push:
    branches:
      - main
      - work/m8-stability-yaku-after-v31
      - work/m7-camera-v33
      - work/m7-camera-v34-manual-fallback
      - work/m7-v35-tile-row-crop
      - work/m7-v36-hardening
      - work/m7-v36-shift-tolerant-recognition
      - work/m7-v36-preview-learning-fix
      - work/m7-v36-face-normalization
      - work/m7-v36-face-library-key
      - work/m7-v36-seam-segmentation
      - work/m7-v36-seam-library-reset
      - work/m7-v37-version-bump
      - work/m7-v38-ink-descriptor
      - work/m7-v39-confidence-suggestions
      - work/m7-v40-robust-ranking-picker
      - work/m7-v41-picker-sync
      - work/m7-v42-picker-current-event
      - work/m7-v43-hog-color-training-images
      - work/m7-v44-direct-template-match
      - work/m7-v45-oriented-normalization
      - work/m7-v46-perspective-rectification
      - work/m7-v47-legacy-learning-migration
      - work/m7-v48-class-balanced-hires
      - work/m7-v49-family-first-ranking
      - work/m7-v50-soft-family-prior
      - work/m7-v51-family-discriminative
      - work/m7-v52-crop-diagnostic
      - work/m7-v53-inner-crop-production
      - work/m7-v54-inner-library-migration
      - work/m7-v55-precision-geometry-guard
      - work/m7-v56-stable-learning-storage
      - work/m7-v57-calibration-photo-preview
      - work/m7-v58-blocking-learning-save
      - work/m7-v59-idb-learning-fallback
      - work/m7-v60-picker-precision
      - work/m7-v61-global-grid-alignment
      - work/m7-v62-picker-layout-distance-diagnostics
      - work/m7-v63-medoid-template-consensus
      - work/m7-v64-structural-shape-ranking
      - work/m7-v65-multiview-consensus
      - work/m7-v66-fast-multiview
      - work/m7-v67-cached-budgeted-multiview
      - work/m7-v68-fast-fullview-consensus
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scoring rules
        run: node --test tests/m8-v32.test.cjs
      - name: Check camera recognition helpers and load order
        run: node --test tests/m7-v33.test.cjs
      - name: Install headless browser control
        run: npm install --no-save --no-audit --no-fund puppeteer-core@24
      - name: Run real Chromium landscape flow
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-smoke.cjs
