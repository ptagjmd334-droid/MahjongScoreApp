name: Mahjong app stability, scoring and camera checks
on:
  push:
    branches:
      - main
      - work/m8-stability-yaku-after-v31
      - work/m7-camera-v33
      - work/m7-camera-v34-manual-fallback
      - work/m7-v35-tile-row-crop
      - work/m7-v36-hardening
      - work/m7-v36-shift-tolerant-recognition
      - work/m7-v36-preview-learning-fix
      - work/m7-v36-face-normalization
      - work/m7-v36-face-library-key
      - work/m7-v36-seam-segmentation
      - work/m7-v36-seam-library-reset
      - work/m7-v37-version-bump
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scoring rules
        run: node --test tests/m8-v32.test.cjs
      - name: Check camera recognition helpers and load order
        run: node --test tests/m7-v33.test.cjs
      - name: Install headless browser control
        run: npm install --no-save --no-audit --no-fund puppeteer-core@24
      - name: Run real Chromium landscape flow
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-smoke.cjs
