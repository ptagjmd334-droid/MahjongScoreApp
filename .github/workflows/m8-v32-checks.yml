jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check scoring rules
        run: node --test tests/m8-v32.test.cjs
      - name: Check camera recognition helpers and load order
        run: node --test tests/m7-v33.test.cjs
      - name: Install headless browser control
        run: npm install --no-save --no-audit --no-fund puppeteer-core@24
      - name: Run real Chromium landscape flow
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: node tests/browser-smoke.cjs
