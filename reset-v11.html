<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>M8 v11 更新リセット</title>
  <style>
    body{margin:0;background:#0b2b23;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;padding:24px;box-sizing:border-box}
    .card{width:min(560px,92vw);background:#153c32;border-radius:20px;padding:28px;box-sizing:border-box;text-align:center;box-shadow:0 16px 40px rgba(0,0,0,.25)}
    h1{font-size:24px;margin:0 0 12px}.status{font-size:16px;line-height:1.7;opacity:.9}.ok{color:#7df0b3}.err{color:#ff9b9b}
    button{margin-top:18px;border:0;border-radius:12px;padding:14px 20px;font-size:16px;font-weight:700;background:#20c77a;color:#fff}
  </style>
</head>
<body>
  <div class="card">
    <h1>M8 v11 更新リセット</h1>
    <div id="status" class="status">古いキャッシュとService Workerを解除しています…</div>
    <button id="retry" hidden>もう一度実行</button>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const retryBtn = document.getElementById('retry');

    async function resetUpdateState(){
      retryBtn.hidden = true;
      statusEl.className = 'status';
      statusEl.textContent = '古いキャッシュとService Workerを解除しています…';

      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
        }

        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
        }

        statusEl.className = 'status ok';
        statusEl.textContent = '解除完了。M8 v11を開きます…';

        setTimeout(() => {
          const stamp = Date.now();
          location.replace('./index.html?fresh=m8v11-' + stamp);
        }, 700);
      } catch (e) {
        console.error(e);
        statusEl.className = 'status err';
        statusEl.textContent = '解除に失敗しました。もう一度実行してください。';
        retryBtn.hidden = false;
      }
    }

    retryBtn.addEventListener('click', resetUpdateState);
    resetUpdateState();
  </script>
</body>
</html>
