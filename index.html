<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>麻雀対局管理アプリ</title>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="麻雀対局管理">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="stylesheet" href="style.css?v=m7v48">
</head>
<body>
  <section id="setup-screen" class="screen active">
    <button id="setup-home-button-v4" class="setup-home-button-v4" type="button" aria-label="ホームへ戻る">← ホーム</button>
    <div class="setup-header"><h1>麻雀対局管理アプリ</h1><p>4人の名前と最初の親を設定してください</p></div>
    <div class="setup-table">
      <div class="setup-player setup-top"><label>上のプレイヤー</label><input id="name-top" type="text" enterkeyhint="next" maxlength="12" value="A"><button class="dealer-select" data-position="top">親にする</button></div>
      <div class="setup-player setup-left"><label>左のプレイヤー</label><input id="name-left" type="text" enterkeyhint="done" maxlength="12" value="D"><button class="dealer-select" data-position="left">親にする</button></div>
      <div class="setup-center"><span>東1局</span><small>25000点スタート</small></div>
      <div class="setup-player setup-right"><label>右のプレイヤー</label><input id="name-right" type="text" maxlength="12" value="B"><button class="dealer-select" data-position="right">親にする</button></div>
      <div class="setup-player setup-bottom"><label>下のプレイヤー</label><input id="name-bottom" type="text" maxlength="12" value="C"><button class="dealer-select active" data-position="bottom">親</button></div>
    </div>
    <button id="go-confirm-button" class="main-button">確認へ進む</button><p id="setup-error" class="error-message"></p>
  </section>
  <section id="confirm-screen" class="screen">
    <div class="confirm-container"><div class="confirm-header"><h2>対局開始前の確認</h2><p>この内容で東1局を開始します</p></div>
      <div class="confirm-table">
        <div id="confirm-top" class="confirm-player confirm-top"><span class="confirm-wind">西</span><strong id="confirm-name-top">A</strong><span>25,000点</span></div>
        <div id="confirm-left" class="confirm-player confirm-left"><span class="confirm-wind">北</span><strong id="confirm-name-left">D</strong><span>25,000点</span></div>
        <div class="confirm-center"><strong>東1局</strong><span>0本場</span><span>供託 0</span><span id="confirm-dealer-name">親：C</span></div>
        <div id="confirm-right" class="confirm-player confirm-right"><span class="confirm-wind">南</span><strong id="confirm-name-right">B</strong><span>25,000点</span></div>
        <div id="confirm-bottom" class="confirm-player confirm-bottom dealer-highlight"><span class="confirm-wind">東</span><strong id="confirm-name-bottom">C</strong><span>25,000点</span></div>
      </div>
      <div class="confirm-buttons"><button id="back-setup-button" class="secondary-button">戻って修正</button><button id="start-game-button" class="main-button no-margin">対局開始</button></div>
    </div>
  </section>
  <section id="game-screen" class="screen">
    <div class="round-info"><strong>東1局</strong><span id="honba-display">0本場</span><span id="kyotaku-display">供託 0</span><span id="dealer-name-display">親：-</span></div>
    <div class="top-actions"><button class="small-button" disabled>Undo</button><button class="small-button">︙</button></div>
    <div id="panel-top" class="player-panel player-top" data-position="top"><span id="delta-top" class="score-delta"></span><div id="wind-top" class="wind">西</div><div class="player-main"><span id="game-name-top" class="player-name">A</span><strong id="score-top" class="player-score">25,000</strong><span id="rank-top" class="player-rank">3位</span></div><button class="riichi-button" data-position="top">リーチ</button></div>
    <div id="panel-left" class="player-panel player-left" data-position="left"><span id="delta-left" class="score-delta"></span><div id="wind-left" class="wind">北</div><div class="player-main"><span id="game-name-left" class="player-name">D</span><strong id="score-left" class="player-score">25,000</strong><span id="rank-left" class="player-rank">4位</span></div><button class="riichi-button" data-position="left">リーチ</button></div>
    <div id="center-actions" class="center-actions"><button id="agari-button" class="agari-button">アガリ</button><button id="ryukyoku-button" class="ryukyoku-button">流局</button></div>
    <div id="agari-overlay" class="agari-overlay hidden"><div class="agari-flow-card"><div class="agari-flow-top"><strong id="agari-flow-title">アガリ</strong><button id="agari-cancel-button" class="flow-cancel-button">キャンセル</button></div><div id="agari-flow-content" class="agari-flow-content"></div></div></div>
    <div id="panel-right" class="player-panel player-right" data-position="right"><span id="delta-right" class="score-delta"></span><div id="wind-right" class="wind">南</div><div class="player-main"><span id="game-name-right" class="player-name">B</span><strong id="score-right" class="player-score">25,000</strong><span id="rank-right" class="player-rank">2位</span></div><button class="riichi-button" data-position="right">リーチ</button></div>
    <div id="panel-bottom" class="player-panel player-bottom dealer" data-position="bottom"><span id="delta-bottom" class="score-delta"></span><div id="wind-bottom" class="wind">東</div><div class="player-main"><span id="game-name-bottom" class="player-name">C</span><strong id="score-bottom" class="player-score">25,000</strong><span id="rank-bottom" class="player-rank">1位</span></div><button class="riichi-button" data-position="bottom">リーチ</button></div>
  </section>
  <div id="riichi-cancel-modal" class="modal hidden"><div class="modal-card"><h2>リーチを取り消しますか？</h2><p id="riichi-cancel-text"></p><div class="modal-buttons"><button id="riichi-cancel-back" class="modal-secondary">戻る</button><button id="riichi-cancel-confirm" class="modal-danger">取り消す</button></div></div></div>
  <div id="landscape-orientation-guard" aria-hidden="true"><div class="landscape-orientation-card"><div class="landscape-phone-icon">↻</div><strong>横向きにしてください</strong><span>このアプリは横画面専用です</span></div></div>
  <div id="app-build-badge" style="position:fixed;left:max(8px,env(safe-area-inset-left));bottom:max(6px,env(safe-area-inset-bottom));z-index:1000000;background:rgba(0,0,0,.72);color:#fff;border-radius:999px;padding:4px 9px;font:700 11px/1.2 -apple-system,BlinkMacSystemFont,sans-serif;pointer-events:none;opacity:.88">M7 v48</div>
  <script src="script.js?v=m7v48"></script>
  <script src="m7-recognition-core.js?v=m7v48"></script>
  <script src="m7-camera-v36.js?v=m7v48"></script>
  <script src="ui-fixes.js?v=m7v48"></script>
  <script src="m8-v3.js?v=m7v48"></script>
  <script src="m8-v5.js?v=m7v48"></script>
  <script src="m8-v6.js?v=m7v48"></script>
  <script src="m8-v7.js?v=m7v48"></script>
  <script src="m8-v8.js?v=m7v48"></script>
  <script src="m8-v9.js?v=m7v48"></script>
  <script src="m8-v12.js?v=m7v48"></script>
  <script src="m8-v18.js?v=m7v48"></script>
  <script src="m8-v19.js?v=m7v48"></script>
  <script src="m8-scoring-core.js?v=m7v48"></script>
  <script src="m8-v21.js?v=m7v48"></script>
  <script src="m8-v22.js?v=m7v48"></script>
  <script src="m8-v23.js?v=m7v48"></script>
  <script src="m8-v24.js?v=m7v48"></script>
  <script src="m8-v25.js?v=m7v48"></script>
  <script src="m8-v26.js?v=m7v48"></script>
  

  
  <script src="m8-v30.js?v=m7v48"></script>
</body>
</html>
